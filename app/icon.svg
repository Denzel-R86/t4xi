<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    T4XI monogram — LIGHT-SCHEME ADAPTATION (favicon, 16/32px).
    Geometrie 1:1 uit de officiële favicon-master (t4xi-favicon.svg). Alleen de
    kleuren zijn aangepast aan het huidige (bevroren) light/navy-schema:
      · achtergrond = navy  (#28313B, accent)
      · monogram    = fog   (#F5F3F1)
      · horizon     = fog   (#F5F3F1), met de vastgelegde dunnere stroke (1.8)
    GEEN Sodium. Dit overschrijft de officiële Asphalt/Sodium-master NIET.
    Kleuren zijn hier hardcoded omdat icon-metadata geen CSS-variabelen toestaat.
  -->
  <rect width="32" height="32" fill="#28313B"/>
  <g fill="none">
    <line x1="20" y1="6" x2="6.9" y2="25.4" stroke="#F5F3F1" stroke-width="2.6"/>
    <line x1="11.1" y1="19.2" x2="24" y2="19.2" stroke="#F5F3F1" stroke-width="2.4"/>
    <line x1="20" y1="6" x2="20" y2="24.5" stroke="#F5F3F1" stroke-width="2.6"/>
    <line x1="6.9" y1="25.4" x2="30" y2="25.4" stroke="#F5F3F1" stroke-width="1.8"/>
  </g>
</svg>
