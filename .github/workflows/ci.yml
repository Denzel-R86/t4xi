name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Sanity/next-intl's current toolchain requires Node >=22.20 and its
          # lockfile is generated with npm 11. Match the verified release
          # runtime so `npm ci` resolves optional SWC peers consistently.
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next-env.d.ts` en `.next/types` zijn bewust gegenereerd en staan niet
      # in git. Een verse CI-clone moet deze types dus vóór `tsc` opbouwen.
      - name: Generate Next.js types
        run: npm exec -- next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
