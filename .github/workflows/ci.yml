name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: development
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Sanity/next-intl's current toolchain requires Node >=22.20 and its
          # lockfile is generated with npm 11. Match the verified release
          # runtime so `npm ci` resolves optional SWC peers consistently.
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next-env.d.ts` en `.next/types` zijn bewust gegenereerd en staan niet
      # in git. Een verse CI-clone moet deze types dus vóór `tsc` opbouwen.
      - name: Generate Next.js types
        run: npm exec -- next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Unit-tests van de SEO-snapshotvergelijking zelf (staan buiten lib/, dus
      # niet in `npm test`).
      - name: Test SEO snapshot comparator
        run: node --import tsx --test "scripts/seo-snapshot/*.test.ts"

      - name: Build
        run: npm run build

      # Experience 2.0 / PR 0.2: start `next start` op de zojuist gebouwde app
      # en vergelijkt alle sitemap-URL's (title, canonical, hreflang, h1, status,
      # robots) met docs/experience-2.0/baseline/seo-snapshot.json. Verlies of
      # wijziging = fout; bewuste wijziging via `npm run seo:snapshot -- --update`.
      - name: SEO snapshot
        run: npm run seo:snapshot
